{% extends 'base.html' %}
{% block title %}Create account · MedCrypt{% endblock %}
{% block body_class %}auth{% endblock %}
{% block body %}
<main class="auth-card">
  <div class="auth-head">
    <span class="brand-mark lg" aria-hidden="true"></span>
    <div>
      <h1>Create your account</h1>
      <p>Register as a patient to access your records</p>
    </div>
  </div>

  {% if error %}
  <div class="error" role="alert">{{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username"
             placeholder="Your full name" required />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password"
             placeholder="Choose a password" required />
    </div>
    <button type="submit" class="btn-block">Create account</button>
  </form>

  <div class="auth-footer">
    Already registered? <a href="{{ url_for('login') }}">Sign in</a>
  </div>
</main>
{% endblock %}
